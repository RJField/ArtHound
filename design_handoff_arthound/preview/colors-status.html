<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<p class="eyebrow">Status — text + 12% tint pill</p>
<div class="row">
  <div class="swatch" style="background:#161229;align-items:flex-start">
    <span style="background:rgba(52,211,153,0.12);color:#34d399;padding:3px 10px;border-radius:9999px;font-size:12px;font-weight:500">Approved</span>
    <div class="hex">success · #34D399</div>
  </div>
  <div class="swatch" style="background:#161229;align-items:flex-start">
    <span style="background:rgba(96,165,250,0.12);color:#60a5fa;padding:3px 10px;border-radius:9999px;font-size:12px;font-weight:500">In Review</span>
    <div class="hex">info · #60A5FA</div>
  </div>
  <div class="swatch" style="background:#161229;align-items:flex-start">
    <span style="background:rgba(251,191,36,0.12);color:#fbbf24;padding:3px 10px;border-radius:9999px;font-size:12px;font-weight:500">Pending</span>
    <div class="hex">warning · #FBBF24</div>
  </div>
  <div class="swatch" style="background:#161229;align-items:flex-start">
    <span style="background:rgba(248,113,113,0.12);color:#f87171;padding:3px 10px;border-radius:9999px;font-size:12px;font-weight:500">Changes</span>
    <div class="hex">error · #F87171</div>
  </div>
</div>
</body></html>
