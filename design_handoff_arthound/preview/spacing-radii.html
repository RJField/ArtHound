<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body>
<p class="eyebrow">Radius scale</p>
<div class="row">
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;border-radius:4px;background:#1f1a3a;border:1px solid #3a2f6b"></div><span class="hex">sm · 4</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;border-radius:6px;background:#1f1a3a;border:1px solid #3a2f6b"></div><span class="hex">md · 6 (button)</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;border-radius:8px;background:#1f1a3a;border:1px solid #3a2f6b"></div><span class="hex">lg · 8 (input)</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;border-radius:12px;background:#1f1a3a;border:1px solid #3a2f6b"></div><span class="hex">xl · 12 (card)</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:32px;border-radius:9999px;background:#1f1a3a;border:1px solid #3a2f6b"></div><span class="hex">pill</span></div>
</div>
<p class="eyebrow" style="margin-top:18px">Spacing — 4-px base grid</p>
<div style="display:flex;align-items:flex-end;gap:8px;height:64px">
  <div style="background:#7c6af4;width:4px;height:4px"></div>
  <div style="background:#7c6af4;width:8px;height:8px"></div>
  <div style="background:#7c6af4;width:12px;height:12px"></div>
  <div style="background:#7c6af4;width:16px;height:16px"></div>
  <div style="background:#7c6af4;width:20px;height:20px"></div>
  <div style="background:#7c6af4;width:24px;height:24px"></div>
  <div style="background:#7c6af4;width:32px;height:32px"></div>
  <div style="background:#7c6af4;width:48px;height:48px"></div>
</div>
<div style="display:flex;gap:8px;font-family:var(--ah-font-mono);font-size:10px;color:#a89cd6;margin-top:6px">
  <span style="width:4px;text-align:center">4</span><span style="width:8px;text-align:center">8</span><span style="width:12px;text-align:center">12</span><span style="width:16px;text-align:center">16</span><span style="width:20px;text-align:center">20</span><span style="width:24px;text-align:center">24</span><span style="width:32px;text-align:center">32</span><span style="width:48px;text-align:center">48</span>
</div>
</body></html>
