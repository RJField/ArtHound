<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .surface-row {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 10px 12px;
    border: 1px solid var(--ah-border);
    border-radius: var(--ah-radius-md);
    background: var(--ah-surface);
    margin-bottom: 8px;
  }
  .surface-row .chip {
    width: 56px; height: 36px; border-radius: 6px;
    border: 1px solid var(--ah-border);
  }
  .surface-row .name {
    font-size: 13px; font-weight: 600; color: var(--ah-fg); line-height: 1.2;
  }
  .surface-row .role {
    font-size: 11px; color: var(--ah-fg-muted); margin-top: 2px;
  }
  .surface-row .hex {
    font-family: var(--ah-font-mono); font-size: 12px;
    color: var(--ah-fg); letter-spacing: 0.02em;
  }
  .stack-demo {
    margin-top: 12px;
    padding: 14px 16px;
    background: #0d0a1a;
    border: 1px solid #3a2f6b;
    border-radius: 12px;
  }
  .stack-demo .lbl {
    font-size: 10px; color: #ece6ff; letter-spacing: 0.08em; text-transform: uppercase;
    font-weight: 600;
  }
  .stack-demo .nest {
    background: #161229; border: 1px solid #3a2f6b; border-radius: 8px;
    padding: 10px 12px; margin-top: 8px;
  }
  .stack-demo .nest .nest-lbl {
    font-size: 10px; color: #ece6ff; letter-spacing: 0.08em; text-transform: uppercase;
    font-weight: 600;
  }
  .stack-demo .input {
    background: #1f1a3a; border-radius: 6px; padding: 7px 10px; margin-top: 8px;
    font-size: 12px; color: #ece6ff;
  }
</style>
</head><body>
<p class="eyebrow">Surface ramp · darkest → lightest</p>

<div class="surface-row">
  <div class="chip" style="background:#0d0a1a"></div>
  <div><div class="name">Background</div><div class="role">Page bg, deepest layer</div></div>
  <div class="hex">#0D0A1A</div>
</div>
<div class="surface-row">
  <div class="chip" style="background:#161229"></div>
  <div><div class="name">Surface</div><div class="role">Cards, top bar, modals</div></div>
  <div class="hex">#161229</div>
</div>
<div class="surface-row">
  <div class="chip" style="background:#1f1a3a"></div>
  <div><div class="name">Surface 2</div><div class="role">Inputs, hover row, sidebar selected</div></div>
  <div class="hex">#1F1A3A</div>
</div>
<div class="surface-row">
  <div class="chip" style="background:#2a2350"></div>
  <div><div class="name">Surface 3</div><div class="role">Secondary buttons, deepest chip</div></div>
  <div class="hex">#2A2350</div>
</div>
<div class="surface-row">
  <div class="chip" style="background:#3a2f6b"></div>
  <div><div class="name">Border</div><div class="role">1px dividers between layers</div></div>
  <div class="hex">#3A2F6B</div>
</div>

<div class="stack-demo">
  <div class="lbl">Page</div>
  <div class="nest">
    <div class="nest-lbl">Surface</div>
    <div class="input">Surface 2 (input)</div>
  </div>
</div>
</body></html>
